<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Agent — Get Started</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="onboard-page">
  <div class="onboard-container">
    <div class="onboard-header">
      <div class="logo">⚡ Job Agent</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <div class="progress-label" id="progress-label">Step 1 of {{ total_steps }}</div>
    </div>

    {% if signup_blocked %}
    <div class="chat-window">
      <div class="bubble bubble-bot">{{ signup_blocked }}</div>
      <div class="bubble bubble-bot">Already have an account? <a href="/signin">Sign in</a>.</div>
    </div>
    {% else %}
    <div class="chat-window" id="chat-window">
      <!-- Messages injected by JS -->
    </div>

    <div class="chat-input-area">
      <!-- Resume upload (hidden until needed) -->
      <div id="resume-upload-area" style="display:none" class="upload-area">
        <label class="upload-label">
          <input type="file" id="resume-file" accept=".pdf,.txt" hidden>
          <span class="upload-btn">📄 Upload PDF</span>
        </label>
        <span class="upload-or">or paste below</span>
      </div>

      <!-- Password entry (hidden until the last step) -->
      <div id="password-area" style="display:none" class="upload-area">
        <input type="password" id="password-input" class="chat-textarea"
               autocomplete="new-password" placeholder="Choose a password (8+ characters)">
        <button class="upload-btn" onclick="submitPassword()">Create account</button>
      </div>

      <div class="input-row">
        <textarea id="chat-input" class="chat-textarea" placeholder="Type your message..." rows="1"></textarea>
        <button id="send-btn" class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
    {% endif %}

    <p class="onboard-footer">Already have an account? <a href="/signin">Sign in</a></p>
  </div>

  {% if not signup_blocked %}
  <script>
    window.JOB_AGENT = {
      totalSteps: {{ total_steps }},
      firstPrompt: {{ first_prompt | tojson }}
    };
  </script>
  <script src="/static/chat.js"></script>
  {% endif %}
</body>
</html>
